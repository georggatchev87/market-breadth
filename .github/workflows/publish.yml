name: Publish breadth series

on:
  schedule:
    # Cron is always UTC and does not shift with DST. Two runs per weekday:
    #
    # 1) After the US close: 23:30 UTC = 19:30 ET (EDT) / 18:30 ET (EST). Both
    #    are past the script's 18:00-ET "session final" gate, so this run emits
    #    the SAME trading day's value once Massive's EOD data is available.
    - cron: "30 23 * * 1-5"
    # 2) Early-morning safety net: 10:30 UTC = 06:30 ET (EDT) / 05:30 ET (EST).
    #    The pipeline is self-healing, so if the evening run was missed/failed,
    #    this run appends the prior day(s). Harmless if already up to date.
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

# Allow the job to push the updated JSON back to the repo.
permissions:
  contents: write

concurrency:
  group: publish-breadth
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the grouped-daily cache between runs so each historical day is
      # fetched from the API at most once. The key rotates daily so the newest
      # cache is always saved; restore-keys fall back to the latest prior cache.
      - name: Restore grouped-daily cache
        uses: actions/cache@v4
        with:
          path: cache
          key: grouped-cache-${{ github.run_id }}
          restore-keys: |
            grouped-cache-

      - name: Check API key is present
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ -z "${MASSIVE_API_KEY}" ]; then
            echo "::error::Repo secret MASSIVE_API_KEY is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Generate breadth series (up + down in one pass)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        shell: bash
        # -e: any failure (incl. Massive API errors -> non-zero exit) fails the
        # job visibly in the Actions tab instead of silently doing nothing.
        run: |
          set -euo pipefail
          python breadth.py --out breadth_5d_up20.json --down-out breadth_5d_down20.json
          echo "Up series tail:";   tail -n 4 breadth_5d_up20.json
          echo "Down series tail:"; tail -n 4 breadth_5d_down20.json

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- breadth_5d_up20.json breadth_5d_down20.json; then
            echo "No change in breadth JSON files; nothing to commit."
          else
            git add breadth_5d_up20.json breadth_5d_down20.json
            git commit -m "Update breadth series (up + down) [skip ci]"
            git push
          fi

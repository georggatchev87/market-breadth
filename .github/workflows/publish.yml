name: Publish breadth series

on:
  schedule:
    # Cron is always UTC and never shifts with DST. We run EVERY day (not just
    # Mon-Fri) at off-peak minutes: GitHub frequently delays or silently drops
    # scheduled runs, and weekday-only / on-the-hour schedules are dropped more
    # often. The pipeline is self-healing, so weekend/holiday runs simply find
    # no new trading day and commit nothing -- harmless. Running daily at two
    # spread-out times maximizes the chance at least one fires each day and, if
    # any run is missed, the next one automatically backfills the gap.
    #
    # FINALIZER after the US close: 23:17 UTC = 19:17 ET (EDT) / 18:17 ET (EST),
    # past the 18:00-ET "session final" gate -> settles today.
    - cron: "17 23 * * *"
    # FINALIZER morning safety net: 10:47 UTC; picks up the prior trading day if
    # the evening run was missed.
    - cron: "47 10 * * *"
    # (The provisional intraday PREVIEW lives in its own workflow, preview.yml.)
  workflow_dispatch:
    inputs:
      mode:
        description: "finalize (settled) or preview (provisional 'today so far')"
        type: choice
        options: [finalize, preview]
        default: finalize

# Allow the job to push the updated JSON back to the repo.
permissions:
  contents: write

concurrency:
  group: publish-breadth
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the grouped-daily cache between runs so each historical day is
      # fetched from the API at most once. The key rotates daily so the newest
      # cache is always saved; restore-keys fall back to the latest prior cache.
      - name: Restore grouped-daily cache
        uses: actions/cache@v4
        with:
          path: cache
          key: grouped-cache-${{ github.run_id }}
          restore-keys: |
            grouped-cache-

      - name: Check API key is present
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ -z "${MASSIVE_API_KEY}" ]; then
            echo "::error::Repo secret MASSIVE_API_KEY is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Scheduled runs here are ALWAYS the finalizer. Manual dispatch may pick a
      # mode (default finalize). The intraday preview is a separate workflow, so
      # there is no fragile per-cron routing.
      - name: Determine run mode
        id: mode
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          echo "mode=${MODE:-finalize}" >> "$GITHUB_OUTPUT"
          echo "Run mode: ${MODE:-finalize}"

      - name: Generate breadth series (${{ steps.mode.outputs.mode }})
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        shell: bash
        # -e: any failure (incl. Massive API errors -> non-zero exit) fails the
        # job visibly in the Actions tab instead of silently doing nothing.
        run: |
          set -euo pipefail
          python breadth.py --mode "${{ steps.mode.outputs.mode }}" \
            --out breadth_5d_up20.json --down-out breadth_5d_down20.json \
            --status-out status.json
          echo "status.json:"; cat status.json 2>/dev/null || echo "(not written this run)"
          echo "Up series tail:";   tail -n 4 breadth_5d_up20.json
          echo "Down series tail:"; tail -n 4 breadth_5d_down20.json

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- breadth_5d_up20.json breadth_5d_down20.json status.json; then
            echo "No change in output files; nothing to commit."
          else
            git add breadth_5d_up20.json breadth_5d_down20.json status.json
            git commit -m "Update breadth series (${{ steps.mode.outputs.mode }}) [skip ci]"
            git push
          fi
